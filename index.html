<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prasad Professional Crypto Scanner — Complete</title>
<style>
:root{
  --bg:#061017;--panel:#0d1922;--panel2:#111f2a;--line:#253745;
  --text:#edf5f8;--muted:#90a5b2;--blue:#1687cb
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#050b10,#07151e 45%,#050b10);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:20px}
h1{margin:0;font-size:28px}
.sub{color:var(--muted);margin:6px 0 18px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.tab{width:auto;border:1px solid var(--line);background:#09151d;color:var(--muted);padding:9px 13px;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer}
.tab.active{background:linear-gradient(180deg,#1687cb,#0f659a);color:#fff}
.panel{display:none}.panel.active{display:block}
.frame-shell{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:8px;overflow:hidden}
iframe{width:100%;border:0;background:transparent;display:block}
#allFrame{height:1050px}
#domFrame{height:1450px}
#oneFrame{height:3000px}
.status{padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#09151d;color:var(--muted);margin-bottom:12px}
@media(max-width:760px){
  .wrap{padding:12px}
  #allFrame{height:1250px}
  #domFrame{height:1600px}
  #oneFrame{height:3500px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prasad Professional Crypto Scanner</h1>
  <p class="sub">Original GitHub All Coins and BTC.D / USDT.D tabs with the latest One Coin scanner.</p>

  <div class="tabs">
    <button class="tab active" data-tab="allPanel">All Coins</button>
    <button class="tab" data-tab="domPanel">BTC.D / USDT.D</button>
    <button class="tab" data-tab="onePanel">One Coin</button>
  </div>

  <section id="allPanel" class="panel active">
    <div id="sourceStatus" class="status">Loading the original All Coins tab from GitHub…</div>
    <div class="frame-shell"><iframe id="allFrame" title="Original All Coins Scanner"></iframe></div>
  </section>

  <section id="domPanel" class="panel">
    <div class="frame-shell"><iframe id="domFrame" title="Original BTC.D and USDT.D Scanner"></iframe></div>
  </section>

  <section id="onePanel" class="panel">
    <div class="frame-shell"><iframe id="oneFrame" title="Latest One Coin Scanner"></iframe></div>
  </section>
</div>

<script>
const RAW_URL='https://raw.githubusercontent.com/prasad984m-blip/Binance-Scanner/main/index.html';
const LIVE_URL='https://prasad984m-blip.github.io/Binance-Scanner/';

function decodeBase64Utf8(encoded){
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function prepareGithubPanel(source,target){
  let html=source;

  // Hide the GitHub page title and its internal top tabs.
  html=html.replace('</style>',`
    body{background:transparent!important}
    .wrap{max-width:none!important;padding:4px!important}
    .wrap>h1,.wrap>.sub,.wrap>.tabs{display:none!important}
    #all,#dom,#one{display:none!important}
    #${target}{display:block!important}
  </style>`);

  // Force the selected original panel to be active.
  html=html.replace(
    new RegExp('<section id="'+target+'" class="panel[^"]*">'),
    '<section id="'+target+'" class="panel active">'
  );

  if(target==='all'){
    const sortingPatch=`
<script>
(function(){
  function supportingPressure(r){
    const longSide=r.signal.includes('UP')||r.signal.includes('LONG')||(r.signal==='WATCH'&&r.buy>=r.sell);
    return longSide?r.buy:r.sell;
  }

  function roomToResistance(r){
    if(!Number.isFinite(r.price)||!Number.isFinite(r.res)||r.price<=0) return -Infinity;
    return Math.max(0,(r.res-r.price)/r.price*100);
  }

  function addSortControl(){
    const controls=document.querySelector('#all .controls');
    if(!controls || document.getElementById('resultSort')) return;

    const label=document.createElement('label');
    label.innerHTML='Sort by<select id="resultSort">'
      +'<option value="score" selected>Score — highest first</option>'
      +'<option value="roomResistance">Room to next resistance — largest first</option>'
      +'<option value="buy">Buy pressure — highest first</option>'
      +'<option value="sell">Sell pressure — highest first</option>'
      +'</select>';

    const scanButton=document.getElementById('scanAll');
    controls.insertBefore(label,scanButton);
    document.getElementById('resultSort').addEventListener('change',()=>render());
  }

  const originalRender=render;
  render=function(){
    const q=$('search').value.trim().toUpperCase();
    const min=+$('minScore').value;
    const tf=$('tf').value;
    const sortBy=$('resultSort')?.value||'score';

    let a=S.results.filter(r=>
      r.score>=min &&
      (!q||r.sym.includes(q)) &&
      (S.filter==='all'||(S.filter==='WATCH'?r.status==='WATCH':r.signal===S.filter))
    );

    a.sort((x,y)=>{
      if(sortBy==='roomResistance'){
        const diff=roomToResistance(y)-roomToResistance(x);
        if(diff!==0) return diff;
      }else if(sortBy==='buy'){
        const diff=y.buy-x.buy;
        if(diff!==0) return diff;
      }else if(sortBy==='sell'){
        const diff=y.sell-x.sell;
        if(diff!==0) return diff;
      }else{
        const diff=y.score-x.score;
        if(diff!==0) return diff;
      }

      const pressureDiff=supportingPressure(y)-supportingPressure(x);
      if(pressureDiff!==0) return pressureDiff;
      return y.score-x.score;
    });

    const tip=(value,title,text)=>'<span class="signal-tip"><strong>'+value+'</strong><span class="tip-icon">?</span><span class="tip-box"><strong>'+title+'</strong><br>'+text+'<br><br><span class="tip-neutral">Check this level against your own chart on the '+tf+' timeframe before making your own trading decision.</span></span></span>';

    $('rows').innerHTML=a.length?a.map((r,i)=>{
      const longSide=r.signal.includes('UP')||r.signal.includes('LONG')||(r.signal==='WATCH'&&r.buy>=r.sell);
      const priceText='Current live/forming-candle price from Binance Futures on '+tf+'. It is '+r.dist.toFixed(2)+'% from the scanner\\'s active '+(longSide?'resistance':'support')+' level.';
      const supportText='Scanner support is the lowest low found in the recent '+tf+' lookback candles. Price is '+Math.max(0,(r.price-r.sup)/Math.max(r.sup,1e-12)*100).toFixed(2)+'% above it.';
      const roomRes=Math.max(0,(r.res-r.price)/Math.max(r.price,1e-12)*100);
      const resistanceText='Scanner resistance is the highest high found in the recent '+tf+' lookback candles. Room from current price to resistance is '+roomRes.toFixed(2)+'%.';
      const entryText='Possible entry selected by the scanner for the current '+r.signal+' setup.';
      const invText='Invalidation is based on the recent '+tf+' candle extreme.';

      return '<tr>'
        +'<td>'+(i+1)+'</td>'
        +'<td><strong>'+r.sym+'</strong></td>'
        +'<td><span class="signal-tip"><span class="pill '+pill(r.signal)+'">'+r.signal+'</span><span class="tip-icon">?</span><span class="tip-box"><strong>Why this signal?</strong><br>'+r.why+'</span></span></td>'
        +'<td><span class="pill '+(r.status==='HIGH CONFIDENCE'||r.status==='POSSIBLE ENTRY'?'up':r.status==='WATCH'?'watch':'neutral')+'">'+r.status+'</span></td>'
        +'<td>'+r.score+'</td>'
        +'<td>'+tip(pf(r.price),'Current price',priceText)+'</td>'
        +'<td>'+tip(pf(r.sup),'Support reference',supportText)+'</td>'
        +'<td>'+tip(pf(r.res),'Resistance reference',resistanceText)+'</td>'
        +'<td>'+roomRes.toFixed(2)+'%</td>'
        +'<td>'+r.vr.toFixed(2)+'×</td>'
        +'<td class="up">'+r.buy.toFixed(1)+'%</td>'
        +'<td class="down">'+r.sell.toFixed(1)+'%</td>'
        +'<td>'+r.rr.toFixed(2)+'×</td>'
        +'<td>'+r.trend+'</td>'
        +'<td>'+tip(pf(r.entry),'Possible entry',entryText)+'</td>'
        +'<td>'+tip(pf(r.inv),'Invalidation level',invText)+'</td>'
        +'</tr>';
    }).join(''):'<tr><td colspan="16" class="hint">No symbols match the current filter.</td></tr>';
  };

  addSortControl();

  const headers=document.querySelectorAll('#all table thead th');
  if(headers[8]) headers[8].textContent='Room to Resistance';
})();
<\/script>`;

    html=html.replace('</body>',sortingPatch+'</body>');
  }

  return html;
}

async function loadOriginalTabs(){
  const status=document.getElementById('sourceStatus');
  try{
    const response=await fetch(RAW_URL,{cache:'no-store'});
    if(!response.ok) throw new Error(response.status+' '+response.statusText);
    const source=await response.text();

    document.getElementById('allFrame').srcdoc=prepareGithubPanel(source,'all');
    document.getElementById('domFrame').srcdoc=prepareGithubPanel(source,'dom');
    status.textContent='Original GitHub All Coins tab loaded successfully.';
  }catch(error){
    status.textContent='Direct source loading was blocked. Opening the live scanner below; use its All Coins and BTC.D / USDT.D tabs.';
    document.getElementById('allFrame').src=LIVE_URL;
    document.getElementById('domFrame').src=LIVE_URL;
  }
}
